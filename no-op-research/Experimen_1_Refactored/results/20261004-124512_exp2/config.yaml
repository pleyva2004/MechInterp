# Experiment 2: does a short natural-language phrase written into random tokens change final-token attention,
# and is that change about the phrase being language, about its particular tokens, or about their surface form?
# The ONLY source of parameters for exp2. Positions are model-input indices (BOS at 0, random tokens at 1..32,
# final/query token at 32). Iteration 3 of the exp2 loop (12 phrases, logit scale); see exp2/LOOP_LOG.md.
model: gpt2-small
seq_len: 32                     # random tokens, excluding BOS
bos_token_id: 50256
query_position: -1              # final token; it is never overwritten, so it stays the base row's random token
diffuse_threshold: 0.2
batch_size: 250
seed: 0
device: cpu
dtype: float32

backends:
  transformer_lens: {model_name: gpt2-small}
  huggingface:      {model_name: gpt2, attn_implementation: eager}
primary_backend: transformer_lens

paths:
  sequences_dir: data/sequences/exp2
  results_dir: results

# Base rows: random ids, no repeats within a row, never containing any phrase id (a repeat would trigger
# duplicate-token / induction heads). Byte tokens (0-255) are left out entirely (exp1: they drive their own heads).
bases:
  rare:   [1000, 39999]         # exp1 condition A
  common: [256, 999]            # exp1 condition C
n_bases: 500                    # per base class; 12 phrases x 9 variants each

# Each phrase: ids are authoritative and written straight into the id array (text is only checked to tokenize to
# them). shuffled = VERB PRON OBJ: same ids, last id kept in place (position 31 identical in nl and shuffled).
phrases:
  sushi: {text: " I like sushi", ids: [314, 588, 36324], shuffled: [588, 314, 36324]}
  water: {text: " we need water", ids: [356, 761, 1660], shuffled: [761, 356, 1660]}
  pizza: {text: " she ate pizza", ids: [673, 15063, 14256], shuffled: [15063, 673, 14256]}
  music: {text: " they love music", ids: [484, 1842, 2647], shuffled: [1842, 484, 2647]}
  coffee: {text: " he drinks coffee", ids: [339, 11758, 6891], shuffled: [11758, 339, 6891]}
  chess: {text: " you play chess", ids: [345, 711, 19780], shuffled: [711, 345, 19780]}
  rain: {text: " I hate rain", ids: [314, 5465, 6290], shuffled: [5465, 314, 6290]}
  cars: {text: " we sell cars", ids: [356, 3677, 5006], shuffled: [3677, 356, 5006]}
  songs: {text: " she wrote songs", ids: [673, 2630, 7259], shuffled: [2630, 673, 7259]}
  rice: {text: " they grow rice", ids: [484, 1663, 11464], shuffled: [1663, 484, 11464]}
  bikes: {text: " he fixed bikes", ids: [339, 5969, 16715], shuffled: [5969, 339, 16715]}
  money: {text: " you want money", ids: [345, 765, 1637], shuffled: [765, 345, 1637]}

placements:
  near: [29, 30, 31]

# Each phrase token alone at each slot it occupies in nl or shuffled; the base row everywhere else.
custom_variants:
  "sushi:I@29": {phrase: sushi, placement: near, writes: [[29, 314]]}
  "sushi:like@30": {phrase: sushi, placement: near, writes: [[30, 588]]}
  "sushi:sushi@31": {phrase: sushi, placement: near, writes: [[31, 36324]]}
  "sushi:like@29": {phrase: sushi, placement: near, writes: [[29, 588]]}
  "sushi:I@30": {phrase: sushi, placement: near, writes: [[30, 314]]}
  "water:we@29": {phrase: water, placement: near, writes: [[29, 356]]}
  "water:need@30": {phrase: water, placement: near, writes: [[30, 761]]}
  "water:water@31": {phrase: water, placement: near, writes: [[31, 1660]]}
  "water:need@29": {phrase: water, placement: near, writes: [[29, 761]]}
  "water:we@30": {phrase: water, placement: near, writes: [[30, 356]]}
  "pizza:she@29": {phrase: pizza, placement: near, writes: [[29, 673]]}
  "pizza:ate@30": {phrase: pizza, placement: near, writes: [[30, 15063]]}
  "pizza:pizza@31": {phrase: pizza, placement: near, writes: [[31, 14256]]}
  "pizza:ate@29": {phrase: pizza, placement: near, writes: [[29, 15063]]}
  "pizza:she@30": {phrase: pizza, placement: near, writes: [[30, 673]]}
  "music:they@29": {phrase: music, placement: near, writes: [[29, 484]]}
  "music:love@30": {phrase: music, placement: near, writes: [[30, 1842]]}
  "music:music@31": {phrase: music, placement: near, writes: [[31, 2647]]}
  "music:love@29": {phrase: music, placement: near, writes: [[29, 1842]]}
  "music:they@30": {phrase: music, placement: near, writes: [[30, 484]]}
  "coffee:he@29": {phrase: coffee, placement: near, writes: [[29, 339]]}
  "coffee:drinks@30": {phrase: coffee, placement: near, writes: [[30, 11758]]}
  "coffee:coffee@31": {phrase: coffee, placement: near, writes: [[31, 6891]]}
  "coffee:drinks@29": {phrase: coffee, placement: near, writes: [[29, 11758]]}
  "coffee:he@30": {phrase: coffee, placement: near, writes: [[30, 339]]}
  "chess:you@29": {phrase: chess, placement: near, writes: [[29, 345]]}
  "chess:play@30": {phrase: chess, placement: near, writes: [[30, 711]]}
  "chess:chess@31": {phrase: chess, placement: near, writes: [[31, 19780]]}
  "chess:play@29": {phrase: chess, placement: near, writes: [[29, 711]]}
  "chess:you@30": {phrase: chess, placement: near, writes: [[30, 345]]}
  "rain:I@29": {phrase: rain, placement: near, writes: [[29, 314]]}
  "rain:hate@30": {phrase: rain, placement: near, writes: [[30, 5465]]}
  "rain:rain@31": {phrase: rain, placement: near, writes: [[31, 6290]]}
  "rain:hate@29": {phrase: rain, placement: near, writes: [[29, 5465]]}
  "rain:I@30": {phrase: rain, placement: near, writes: [[30, 314]]}
  "cars:we@29": {phrase: cars, placement: near, writes: [[29, 356]]}
  "cars:sell@30": {phrase: cars, placement: near, writes: [[30, 3677]]}
  "cars:cars@31": {phrase: cars, placement: near, writes: [[31, 5006]]}
  "cars:sell@29": {phrase: cars, placement: near, writes: [[29, 3677]]}
  "cars:we@30": {phrase: cars, placement: near, writes: [[30, 356]]}
  "songs:she@29": {phrase: songs, placement: near, writes: [[29, 673]]}
  "songs:wrote@30": {phrase: songs, placement: near, writes: [[30, 2630]]}
  "songs:songs@31": {phrase: songs, placement: near, writes: [[31, 7259]]}
  "songs:wrote@29": {phrase: songs, placement: near, writes: [[29, 2630]]}
  "songs:she@30": {phrase: songs, placement: near, writes: [[30, 673]]}
  "rice:they@29": {phrase: rice, placement: near, writes: [[29, 484]]}
  "rice:grow@30": {phrase: rice, placement: near, writes: [[30, 1663]]}
  "rice:rice@31": {phrase: rice, placement: near, writes: [[31, 11464]]}
  "rice:grow@29": {phrase: rice, placement: near, writes: [[29, 1663]]}
  "rice:they@30": {phrase: rice, placement: near, writes: [[30, 484]]}
  "bikes:he@29": {phrase: bikes, placement: near, writes: [[29, 339]]}
  "bikes:fixed@30": {phrase: bikes, placement: near, writes: [[30, 5969]]}
