# Experiment 3, E3.4: repeated phrase, induction as the positive control (exp3/DESIGN.md section 3; predictions in
# exp3/PREDICTIONS_e34.md, written before any E3.4 data). The ONLY source of parameters for exp3.run_e34.
# Positions are model-input indices (BOS at 0, random tokens at 1..32, final/query token at 32).
model: gpt2-small
seq_len: 32                     # random tokens, excluding BOS
bos_token_id: 50256
diffuse_threshold: 0.2
seed: 0
device: cpu
dtype: float32

backends:
  transformer_lens: {model_name: gpt2-small}
  huggingface:      {model_name: gpt2, attn_implementation: eager}
primary_backend: transformer_lens

paths:
  sequences_dir: data/sequences/exp3
  results_dir: results

# Base rows: random ids, no repeats within a row; every phrase id is excluded from the filler (as in Exp 2).
bases:
  rare:   [1000, 39999]
  common: [256, 999]
n_bases: 500                    # per base class (DESIGN.md section 2 rule 4)

# false: the main E3.4 design (8 variants x 12 phrases). true: the pre-registered fallback (run only if E4a fails).
fallback: false

# The 12 pronoun-verb-object phrases of iteration 3 (configs/exp2_iter3.yaml). ids are authoritative; text is only
# checked to tokenize to them.
phrases:
  sushi:  {text: " I like sushi",     ids: [314, 588, 36324]}
  water:  {text: " we need water",    ids: [356, 761, 1660]}
  pizza:  {text: " she ate pizza",    ids: [673, 15063, 14256]}
  music:  {text: " they love music",  ids: [484, 1842, 2647]}
  coffee: {text: " he drinks coffee", ids: [339, 11758, 6891]}
  chess:  {text: " you play chess",   ids: [345, 711, 19780]}
  rain:   {text: " I hate rain",      ids: [314, 5465, 6290]}
  cars:   {text: " we sell cars",     ids: [356, 3677, 5006]}
  songs:  {text: " she wrote songs",  ids: [673, 2630, 7259]}
  rice:   {text: " they grow rice",   ids: [484, 1663, 11464]}
  bikes:  {text: " he fixed bikes",   ids: [339, 5969, 16715]}
  money:  {text: " you want money",   ids: [345, 765, 1637]}

# other-nl: for each phrase, the next phrase in the list above (money wraps to sushi). Fixed before data. Each pair
# shares no id (checked at run time), and every phrase serves exactly once as "another phrase".
other_nl:
  sushi: water
  water: pizza
  pizza: music
  music: coffee
  coffee: chess
  chess: rain
  rain: cars
  cars: songs
  songs: rice
  rice: bikes
  bikes: money
  money: sushi

# Phrase A B C at 10-12, A at 31, query B at 32: Dup = 11 (the earlier B), Copy = 12 (the token after it).
layout: {phrase: [10, 11, 12], previous: 31, query: 32, dup: 11, copy: 12}
# Fallback: a 15-id random block at 2-16, its first 13 ids again at 19-31, query = its 14th id (Dup 15, Copy 16).
fallback_layout: {block: [2, 16], repeat: [19, 31], query: 32, dup: 15, copy: 16}

# A' B' C': per row, one id per phrase token with the same values of these features and from the same id class
# (exp2's matched pools).
match_features: [leading_space, is_alpha, is_capitalized]
token_classes:
  common: [256, 999]
  rare:   [1000, 39999]

extraction:
  chunk_rows: 20                # one TL forward pass = chunk_rows rows x 12 units of one variant (240 sequences)

# Contrasts: a - b per row; category masks from `mask_from` (default: a, the treated arm). DESIGN.md section 3.
# `measures` restricts a contrast to those measures (no labels / switches / TV): repeat-matched and repeat-rand hold
# other tokens at 31-32 than repeat-nl, so they are compared on copy-target mass only (DESIGN.md).
contrasts:
  rand:        {a: repeat-rand, b: norepeat-rand}                          # E4a, E4b
  content:     {a: repeat-nl, b: repeat-matched, measures: [Copy]}         # E4c (copy-target mass only)
  nl_vs_rand:  {a: repeat-nl, b: repeat-rand, measures: [Copy]}            # reported alongside E4c
  park:        {a: repeat-nl, b: other-nl}                                 # E4d
  two_tok:     {a: repeat-nl, b: repeat-nl-1}                              # E4e
  nl_repeat:   {a: repeat-nl, b: norepeat-nl}                              # reported (repeat effect on natural text)
  placebo:     {a: norepeat-rand_b, b: norepeat-rand, mask_from: repeat-rand}
fallback_contrasts:
  fb:          {a: fb-repeat, b: fb-norepeat}
  placebo:     {a: fb-norepeat_b, b: fb-norepeat, mask_from: fb-repeat}

induction: {variant: repeat-rand, threshold: 0.3}
fallback_induction: {variant: fb-repeat, threshold: 0.3}
ioi_heads: [L5H5, L6H9]         # should be among the induction heads (a check, not a prediction)

# E4d: the 10 late heads (layers 6-11) with the largest VO interaction in Test A, fixed before any E3.4 run.
# Source: results/20261004-152303_exp2/additivity_heads.parquet, combo == VO, metric == sink_mass, layers 6-11.
# Per head: mean of `interaction` ((VO - none) - (V - none) - (O - none), BOS mass) over the 12 phrases x 2 base
# classes; the 10 largest means (+0.059 ... +0.020; 11th L9H11 +0.020). Ranking by |mean| gives the same 10.
e4d_heads: [L7H0, L6H0, L8H7, L7H11, L8H5, L6H11, L9H3, L6H8, L10H2, L8H11]

analysis:
  late_layers: [6, 11]          # inclusive
  margin: 0.005                 # m for TOST equivalence (DESIGN.md section 2)
  bootstrap: {iters: 2000, seed: 0}
  meaningful: {q: 0.05, min_abs: 0.02}
  switch: {q: 0.05, min_shift: 0.15}
  max_placebo_switches: 1
  e4d_null: {sets: 1000, seed: 3}

checks:
  hf_rows: 25                   # per base class: TL vs HF on identical ids (all variants and phrases)
  hf_atol: 1.0e-4
  determinism_rows: 20          # per base class: re-extract the first chunk(s) covering these rows; must match exactly
  row_sum_atol: 1.0e-4

figures:
  tokenizer: gpt2               # decoding ids for features and display only, never to build model input

outputs:
  save_att_row: true            # per-row unit-averaged attention [rows, V, L, H, K] in attention.npz (~160 MB at 500 rows)

# Pre-registered (exp3/PREDICTIONS_e34.md). Each must hold in both base classes.
predictions:
  - {id: E4a, kind: switch_count, contrast: rand, labels: argmax, from: Sink, to: Copy, layers: [5, 7], min_beyond_placebo: 3}
  - {id: E4b, kind: renorm_excess, contrast: rand, target: BOS, gain: Copy}
  - {id: E4c, kind: noninferior, contrast: content, measure: Copy, margin: 0.05, alongside: nl_vs_rand}
  - {id: E4d, kind: head_set_loss, contrast: park, measure: BOS, min_count: 3, null_quantile: 95}
  - {id: E4e, kind: positive, contrast: two_tok, measure: Copy}
fallback_predictions:
  - {id: E4a-fallback, kind: switch_count, contrast: fb, labels: argmax, from: Sink, to: Copy, layers: [5, 7], min_beyond_placebo: 3}
