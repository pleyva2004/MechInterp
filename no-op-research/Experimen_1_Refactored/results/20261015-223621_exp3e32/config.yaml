# Experiment 3, E3.2: span length, from one word to natural text (exp3/DESIGN.md section 3; predictions in
# exp3/PREDICTIONS_e32.md, written before any E3.2 data). The ONLY source of parameters for exp3.run_e32.
# Positions are model-input indices (BOS at 0, random tokens at 1..32, final/query token at 32).
model: gpt2-small
seq_len: 32                     # random tokens, excluding BOS
bos_token_id: 50256
diffuse_threshold: 0.2
seed: 0
device: cpu
dtype: float32

backends:
  transformer_lens: {model_name: gpt2-small}
  huggingface:      {model_name: gpt2, attn_implementation: eager}
primary_backend: transformer_lens

paths:
  sequences_dir: data/sequences/exp3
  results_dir: results

# Base rows: random ids from the whole class range, no repeats within a row, shared across passages. Exclusion is per
# passage: a filler id that occurs in that passage (or is its t) is redrawn from the pool minus the passage and the row.
bases:
  rare:   [1000, 39999]
  common: [256, 999]
n_bases: 200                    # per base class (DESIGN.md section 4)

# The passage's last k tokens before t sit at 32 - k .. 31. shuffled for k >= 3; matched_b (placebo) at 8 and 31.
# passage-rr: k = 31 with `rr` back to the row's own tokens. The 2 x 2 (passage / none x t / w) is at k = 31.
layout:
  ks: [1, 2, 3, 4, 6, 8, 12, 16, 24, 31]
  shuffled_ks: [3, 4, 6, 8, 12, 16, 24, 31]
  placebo_ks: [8, 31]
  rr: [30, 31]
  query: 32
passage_min_tokens: 32          # tokens before t

