# matched / matched_b / w: per row, one id per word with the same values of these features and from the same id class
# (exp2's matched pools), minus every id of the passage and t. Punctuation = byte ids (0-255) and any token whose
# stripped text is not alphabetic; it stays in place.
match_features: [leading_space, is_alpha, is_capitalized]
token_classes:
  common: [256, 999]
  rare:   [1000, 39999]

extraction:
  chunk_rows: 20                # one TL forward pass = chunk_rows rows x 12 passages of one variant (240 sequences)

# Contrasts: a - b per row; category masks from `mask_from` (default: a, the treated arm). DESIGN.md section 2.
# The sweep contrasts are generated from `layout` by exp3.e32.contrast_specs:
#   E_k = nl_k - none; order_k = nl_k - shuffled_k; content_k = nl_k - matched_k;
#   placebo_k = matched_b_k - matched_k (masks from matched_k).
# The fixed ones:
contrasts:
  rr:          {a: passage-rr, b: none}         # E2d (with E_31)
  final_pair:  {a: nl_31, b: passage-rr}        # reported: the final pair given 29 tokens of context
  ctx_t:       {a: passage+t, b: none+t}        # 2 x 2: context effect, query t
  ctx_w:       {a: passage+w, b: none+w}        # 2 x 2: context effect, query w
  query_ctx:   {a: passage+t, b: passage+w}     # E2c switches (t vs w after the passage)
  query_none:  {a: none+t, b: none+w}           # 2 x 2: query effect without context

analysis:
  late_layers: [6, 11]          # inclusive
  margin: 0.005                 # m for TOST equivalence (DESIGN.md section 2)
  bootstrap: {iters: 2000, seed: 0}
  meaningful: {q: 0.05, min_abs: 0.02}
  switch: {q: 0.05, min_shift: 0.15}
  max_placebo_switches: 1
  saturation: {kappa_bounds: [0.05, 1000.0], e_inf_bounds: [-1.0, 1.0], kappa_start: 3.0}

checks:
  hf_rows: 10                   # per base class: TL vs HF on identical ids (all 36 variants x 12 passages)
  hf_atol: 1.0e-4
  determinism_rows: 20          # per base class: re-extract the first chunk(s) covering these rows; must match exactly
  row_sum_atol: 1.0e-4

figures:
  tokenizer: gpt2               # decoding ids for features and display only, never to build model input

outputs:
  save_att_row: true            # per-row passage-averaged attention [rows, V, L, H, K] (~137 MB per base class)

# Pre-registered (exp3/PREDICTIONS_e32.md). Each must hold in both base classes; a prediction passes when all its
# parts hold. combo: {variant: coefficient}, per row, on late pooled BOS mass (layers 6-11, passage-averaged).
# test: positive (95% CI > 0), negative (95% CI < 0), equivalent (TOST: 90% CI inside +-margin), switch_count.
predictions:
  - id: E2a
    parts:
      - {name: "E(3) > 0", test: positive, combo: {nl_3: 1, none: -1}}
      - {name: "E(8) − E(3) ≈ 0", test: equivalent, combo: {nl_8: 1, nl_3: -1}}
      - {name: "E(31) − E(3) ≈ 0", test: equivalent, combo: {nl_31: 1, nl_3: -1}}
  - id: E2b
    parts:
      - {name: "k=3", test: positive, combo: {nl_3: 1, shuffled_3: -1}}
      - {name: "k=4", test: positive, combo: {nl_4: 1, shuffled_4: -1}}
      - {name: "k=6", test: positive, combo: {nl_6: 1, shuffled_6: -1}}
      - {name: "k=8", test: positive, combo: {nl_8: 1, shuffled_8: -1}}
      - {name: "k=12", test: positive, combo: {nl_12: 1, shuffled_12: -1}}
      - {name: "k=16", test: positive, combo: {nl_16: 1, shuffled_16: -1}}
      - {name: "k=24", test: positive, combo: {nl_24: 1, shuffled_24: -1}}
      - {name: "k=31", test: positive, combo: {nl_31: 1, shuffled_31: -1}}
  - id: E2c
    parts:
      - {name: "interaction < 0", test: negative, combo: {passage+t: 1, none+t: -1, passage+w: -1, none+w: 1}}
      - {name: "Sink→Span switches", test: switch_count, contrast: query_ctx, labels: argmax, from: Sink, to: Span,
         layers: [6, 11], min_beyond_placebo: 5, placebo: [placebo_8, placebo_31]}
  - id: E2d
    parts:
      - {name: "E(31) − 2·(passage-rr − none) > 0", test: positive, combo: {nl_31: 1, passage-rr: -2, none: 1}}
