# Experiment 3, E3.3: distance sweep (exp3/DESIGN.md section 3; predictions in exp3/PREDICTIONS_e33.md, written
# before any E3.3 data). The ONLY source of parameters for exp3.run_e33.
# Positions are model-input indices (BOS at 0, random tokens at 1..32, final/query token at 32; at 24 in the length
# control).
model: gpt2-small
seq_len: 32                     # random tokens, excluding BOS
bos_token_id: 50256
diffuse_threshold: 0.2
seed: 0
device: cpu
dtype: float32

backends:
  transformer_lens: {model_name: gpt2-small}
  huggingface:      {model_name: gpt2, attn_implementation: eager}
primary_backend: transformer_lens

paths:
  sequences_dir: data/sequences/exp3
  results_dir: results

# Base rows: random ids, no repeats within a row; every phrase id is excluded from the filler (as in Exp 2).
bases:
  rare:   [1000, 39999]
  common: [256, 999]
n_bases: 200                    # per base class (DESIGN.md section 4)

# The 12 pronoun-verb-object phrases of iteration 3 (configs/exp2_iter3.yaml). ids are authoritative; text is only
# checked to tokenize to them. shuffled = V P O: same ids, O kept last.
phrases:
  sushi:  {text: " I like sushi",     ids: [314, 588, 36324],   shuffled: [588, 314, 36324]}
  water:  {text: " we need water",    ids: [356, 761, 1660],    shuffled: [761, 356, 1660]}
  pizza:  {text: " she ate pizza",    ids: [673, 15063, 14256], shuffled: [15063, 673, 14256]}
  music:  {text: " they love music",  ids: [484, 1842, 2647],   shuffled: [1842, 484, 2647]}
  coffee: {text: " he drinks coffee", ids: [339, 11758, 6891],  shuffled: [11758, 339, 6891]}
  chess:  {text: " you play chess",   ids: [345, 711, 19780],   shuffled: [711, 345, 19780]}
  rain:   {text: " I hate rain",      ids: [314, 5465, 6290],   shuffled: [5465, 314, 6290]}
  cars:   {text: " we sell cars",     ids: [356, 3677, 5006],   shuffled: [3677, 356, 5006]}
  songs:  {text: " she wrote songs",  ids: [673, 2630, 7259],   shuffled: [2630, 673, 7259]}
  rice:   {text: " they grow rice",   ids: [484, 1663, 11464],  shuffled: [1663, 484, 11464]}
  bikes:  {text: " he fixed bikes",   ids: [339, 5969, 16715],  shuffled: [5969, 339, 16715]}
  money:  {text: " you want money",   ids: [345, 765, 1637],    shuffled: [765, 345, 1637]}

# P V O at (end - 2 - g, end - 1 - g, end - g) for every gap g; random filler between the phrase and the query.
# Placebo: matched vs matched_b at placebo_gap. Length control: the row's first seq_len tokens, phrase at `phrase`.
layout:
  gaps: [0, 1, 2, 3, 4, 6, 8, 12, 15, 24]
  phrase_end: 31
  query: 32
  placebo_gap: 0
  length_control: {seq_len: 24, phrase: [21, 22, 23]}

# matched / matched_b: per row, one id per phrase token with the same values of these features and from the same id
# class (exp2's matched pools).
match_features: [leading_space, is_alpha, is_capitalized]
token_classes:
  common: [256, 999]
  rare:   [1000, 39999]

extraction:
  chunk_rows: 20                # one TL forward pass = chunk_rows rows x 12 units of one variant (240 sequences)

# Contrasts: a - b per row; category masks from `mask_from` (default: a, the treated arm). DESIGN.md section 3.
# Each contrast compares variants of one length (the engine refuses masks across key lengths).
contrasts:
  order_g0:  {a: nl_g0,  b: shuffled_g0}       # E(0), E3a
  order_g1:  {a: nl_g1,  b: shuffled_g1}       # E(1), E3a
  order_g2:  {a: nl_g2,  b: shuffled_g2}
  order_g3:  {a: nl_g3,  b: shuffled_g3}
  order_g4:  {a: nl_g4,  b: shuffled_g4}
  order_g6:  {a: nl_g6,  b: shuffled_g6}
  order_g8:  {a: nl_g8,  b: shuffled_g8}       # length control: same absolute position as len24
  order_g12: {a: nl_g12, b: shuffled_g12}
  order_g15: {a: nl_g15, b: shuffled_g15}
  order_g24: {a: nl_g24, b: shuffled_g24}      # E(24), E3b
  total_g0:  {a: nl_g0,  b: none}
  total_g1:  {a: nl_g1,  b: none}
  total_g2:  {a: nl_g2,  b: none}
  total_g3:  {a: nl_g3,  b: none}
  total_g4:  {a: nl_g4,  b: none}
  total_g6:  {a: nl_g6,  b: none}
  total_g8:  {a: nl_g8,  b: none}
  total_g12: {a: nl_g12, b: none}
  total_g15: {a: nl_g15, b: none}              # E3c
  total_g24: {a: nl_g24, b: none}
  len24:     {a: nl_len24, b: shuffled_len24}  # E at (24 tokens, g = 0)
  placebo:   {a: matched, b: matched_b, mask_from: nl_g0}

# Sweep bookkeeping for the outputs: the contrast prefixes per effect, and the length-control comparison.
sweep:
  order: order_g                # E(g) = order_g<g>
  total: total_g                # total effect = total_g<g>
length_control: {contrast: len24, same_distance: order_g0, same_position: order_g8}
half_distance: {measure: BOS, ratio: 0.5, long_range_min: 4}

analysis:
  late_layers: [6, 11]          # inclusive
  margin: 0.005                 # m for TOST equivalence (DESIGN.md section 2)
  bootstrap: {iters: 2000, seed: 0}
  meaningful: {q: 0.05, min_abs: 0.02}
  switch: {q: 0.05, min_shift: 0.15}
  max_placebo_switches: 1
  # Copy / Dup / Delimiter are not defined in E3.3 (always 0), so they are not analysed.
  measures: [BOS, Previous, Self, Span, Filler, Phrase]

checks:
  hf_rows: 10                   # per base class: TL vs HF on identical ids (all variants and phrases)
  hf_atol: 1.0e-4
  determinism_rows: 20          # per base class: re-extract the first chunk(s) covering these rows; must match exactly
  row_sum_atol: 1.0e-4

figures:
  tokenizer: gpt2               # decoding ids for features and display only, never to build model input

outputs:
  save_att_row: true            # per-row unit-averaged attention [rows, V, L, H, K] in attention.npz (~95 MB per class)

# Pre-registered (exp3/PREDICTIONS_e33.md). Each must hold in both base classes. measure BOS = sink mass.
predictions:
  - {id: E3a, kind: combination_positive, terms: [[order_g0, 1.0], [order_g1, -2.0]], measure: BOS}
  - {id: E3b, kind: equivalent, contrast: order_g24, measure: BOS, margin: 0.005}
  - {id: E3c, kind: positive, contrast: total_g15, measure: BOS}
