    "sushi:PV": {phrase: sushi, placement: near, variant: "sushi:I@29+like@30", label: PV, parts: ["sushi:I@29", "sushi:like@30"]}
    "sushi:VO": {phrase: sushi, placement: near, variant: "sushi:like@30+sushi@31", label: VO, parts: ["sushi:like@30", "sushi:sushi@31"]}
