# Matched controls: per row, one random id per phrase token with the same values of these features and from the
# same id class as that token (exp1ext: leading space and byte-ness predicted per-token effects best).
match_features: [leading_space, is_alpha, is_capitalized]
token_classes:
  common: [256, 999]
  rare:   [1000, 39999]

# Paired contrasts, a - b per row. total = order + identity + form exactly (on means).
contrasts:
  total:    [nl, none]          # inserting the phrase at all
  order:    [nl, shuffled]      # word order / grammaticality, same tokens
  identity: [shuffled, matched] # these particular tokens vs same-form random tokens
  form:     [matched, none]     # same-form words vs the base class's random tokens
  placebo:  [matched, matched_b] # two exchangeable random draws: should show nothing (noise floor)

# interaction per row = (combo - none) - sum(part - none); 0 under exact additivity of the single-token effects
additivity:
  metrics: [sink_mass, sink_logit]   # sink_logit = log(p / (1 - p)): checks the bounded-scale objection
  combos:
    "sushi:nl":       {phrase: sushi, placement: near, variant: nl, parts: ["sushi:I@29", "sushi:like@30", "sushi:sushi@31"]}
    "sushi:shuffled": {phrase: sushi, placement: near, variant: shuffled, parts: ["sushi:like@29", "sushi:I@30", "sushi:sushi@31"]}
    "water:nl":       {phrase: water, placement: near, variant: nl, parts: ["water:we@29", "water:need@30", "water:water@31"]}
    "water:shuffled": {phrase: water, placement: near, variant: shuffled, parts: ["water:need@29", "water:we@30", "water:water@31"]}
    "pizza:nl":       {phrase: pizza, placement: near, variant: nl, parts: ["pizza:she@29", "pizza:ate@30", "pizza:pizza@31"]}
    "pizza:shuffled": {phrase: pizza, placement: near, variant: shuffled, parts: ["pizza:ate@29", "pizza:she@30", "pizza:pizza@31"]}
    "music:nl":       {phrase: music, placement: near, variant: nl, parts: ["music:they@29", "music:love@30", "music:music@31"]}
    "music:shuffled": {phrase: music, placement: near, variant: shuffled, parts: ["music:love@29", "music:they@30", "music:music@31"]}
    "coffee:nl":       {phrase: coffee, placement: near, variant: nl, parts: ["coffee:he@29", "coffee:drinks@30", "coffee:coffee@31"]}
    "coffee:shuffled": {phrase: coffee, placement: near, variant: shuffled, parts: ["coffee:drinks@29", "coffee:he@30", "coffee:coffee@31"]}
    "chess:nl":       {phrase: chess, placement: near, variant: nl, parts: ["chess:you@29", "chess:play@30", "chess:chess@31"]}
    "chess:shuffled": {phrase: chess, placement: near, variant: shuffled, parts: ["chess:play@29", "chess:you@30", "chess:chess@31"]}
    "rain:nl":       {phrase: rain, placement: near, variant: nl, parts: ["rain:I@29", "rain:hate@30", "rain:rain@31"]}
    "rain:shuffled": {phrase: rain, placement: near, variant: shuffled, parts: ["rain:hate@29", "rain:I@30", "rain:rain@31"]}
    "cars:nl":       {phrase: cars, placement: near, variant: nl, parts: ["cars:we@29", "cars:sell@30", "cars:cars@31"]}
    "cars:shuffled": {phrase: cars, placement: near, variant: shuffled, parts: ["cars:sell@29", "cars:we@30", "cars:cars@31"]}
    "songs:nl":       {phrase: songs, placement: near, variant: nl, parts: ["songs:she@29", "songs:wrote@30", "songs:songs@31"]}
    "songs:shuffled": {phrase: songs, placement: near, variant: shuffled, parts: ["songs:wrote@29", "songs:she@30", "songs:songs@31"]}
    "rice:nl":       {phrase: rice, placement: near, variant: nl, parts: ["rice:they@29", "rice:grow@30", "rice:rice@31"]}
    "rice:shuffled": {phrase: rice, placement: near, variant: shuffled, parts: ["rice:grow@29", "rice:they@30", "rice:rice@31"]}
    "bikes:nl":       {phrase: bikes, placement: near, variant: nl, parts: ["bikes:he@29", "bikes:fixed@30", "bikes:bikes@31"]}
    "bikes:shuffled": {phrase: bikes, placement: near, variant: shuffled, parts: ["bikes:fixed@29", "bikes:he@30", "bikes:bikes@31"]}
    "money:nl":       {phrase: money, placement: near, variant: nl, parts: ["money:you@29", "money:want@30", "money:money@31"]}
