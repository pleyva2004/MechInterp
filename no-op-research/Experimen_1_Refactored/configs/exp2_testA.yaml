    "music:VO": {phrase: music, placement: near, variant: "music:love@30+music@31", label: VO, parts: ["music:love@30", "music:music@31"]}
    "music:PO": {phrase: music, placement: near, variant: "music:they@29+music@31", label: PO, parts: ["music:they@29", "music:music@31"]}
    "coffee:PV": {phrase: coffee, placement: near, variant: "coffee:he@29+drinks@30", label: PV, parts: ["coffee:he@29", "coffee:drinks@30"]}
    "coffee:VO": {phrase: coffee, placement: near, variant: "coffee:drinks@30+coffee@31", label: VO, parts: ["coffee:drinks@30", "coffee:coffee@31"]}
    "coffee:PO": {phrase: coffee, placement: near, variant: "coffee:he@29+coffee@31", label: PO, parts: ["coffee:he@29", "coffee:coffee@31"]}
    "chess:PV": {phrase: chess, placement: near, variant: "chess:you@29+play@30", label: PV, parts: ["chess:you@29", "chess:play@30"]}
