    "chess:PO": {phrase: chess, placement: near, variant: "chess:you@29+chess@31", label: PO, parts: ["chess:you@29", "chess:chess@31"]}
    "rain:PV": {phrase: rain, placement: near, variant: "rain:I@29+hate@30", label: PV, parts: ["rain:I@29", "rain:hate@30"]}
    "rain:VO": {phrase: rain, placement: near, variant: "rain:hate@30+rain@31", label: VO, parts: ["rain:hate@30", "rain:rain@31"]}
    "rain:PO": {phrase: rain, placement: near, variant: "rain:I@29+rain@31", label: PO, parts: ["rain:I@29", "rain:rain@31"]}
    "cars:PV": {phrase: cars, placement: near, variant: "cars:we@29+sell@30", label: PV, parts: ["cars:we@29", "cars:sell@30"]}
    "cars:VO": {phrase: cars, placement: near, variant: "cars:sell@30+cars@31", label: VO, parts: ["cars:sell@30", "cars:cars@31"]}
    "cars:PO": {phrase: cars, placement: near, variant: "cars:we@29+cars@31", label: PO, parts: ["cars:we@29", "cars:cars@31"]}
    "songs:PV": {phrase: songs, placement: near, variant: "songs:she@29+wrote@30", label: PV, parts: ["songs:she@29", "songs:wrote@30"]}
    "songs:VO": {phrase: songs, placement: near, variant: "songs:wrote@30+songs@31", label: VO, parts: ["songs:wrote@30", "songs:songs@31"]}
    "songs:PO": {phrase: songs, placement: near, variant: "songs:she@29+songs@31", label: PO, parts: ["songs:she@29", "songs:songs@31"]}
    "rice:PV": {phrase: rice, placement: near, variant: "rice:they@29+grow@30", label: PV, parts: ["rice:they@29", "rice:grow@30"]}
    "rice:VO": {phrase: rice, placement: near, variant: "rice:grow@30+rice@31", label: VO, parts: ["rice:grow@30", "rice:rice@31"]}
    "rice:PO": {phrase: rice, placement: near, variant: "rice:they@29+rice@31", label: PO, parts: ["rice:they@29", "rice:rice@31"]}
    "bikes:PV": {phrase: bikes, placement: near, variant: "bikes:he@29+fixed@30", label: PV, parts: ["bikes:he@29", "bikes:fixed@30"]}
    "bikes:VO": {phrase: bikes, placement: near, variant: "bikes:fixed@30+bikes@31", label: VO, parts: ["bikes:fixed@30", "bikes:bikes@31"]}
    "bikes:PO": {phrase: bikes, placement: near, variant: "bikes:he@29+bikes@31", label: PO, parts: ["bikes:he@29", "bikes:bikes@31"]}
    "money:PV": {phrase: money, placement: near, variant: "money:you@29+want@30", label: PV, parts: ["money:you@29", "money:want@30"]}
    "money:VO": {phrase: money, placement: near, variant: "money:want@30+money@31", label: VO, parts: ["money:want@30", "money:money@31"]}
    "money:PO": {phrase: money, placement: near, variant: "money:you@29+money@31", label: PO, parts: ["money:you@29", "money:money@31"]}
  differences: [[nl, shuffled]]
  linear_terms:                 # three-way term = nl interaction minus the three pair interactions
    triple: {nl: 1, PV: -1, VO: -1, PO: -1}
  pooled_differences: [[VO, PV], [VO, PO]]
  familiarity: {PV: [0, 1], VO: [1, 2]}   # phrase id indices of the adjacent pairs scored by -log p(second | BOS first)
depth_groups:
  early: [0, 1, 2, 3, 4, 5]
  late:  [6, 7, 8, 9, 10, 11]

# The model's own -log p(token | everything before it), TL only, summed over the slot positions; regressed against
# the additivity metric within each row across every variant. query_position_nll is recorded but not used in checks.
surprisal:
  slot_positions: [29, 30, 31]
  batch_size: 50                # full-vocabulary logits are built only at these positions

# slot_mass = attention on the slot positions; slot_logratio = log(slot_mass / sink_mass), which cancels the
# softmax normalizer (so it is not moved just because some other key gained or lost weight).
metrics: [sink_mass, slot_mass, prev_mass, entropy]
slot_logratio_eps: 1.0e-12      # floor on both masses inside the log
sink_logit_eps: 1.0e-6          # clip sink_mass to [eps, 1 - eps] before the logit
min_effect:                     # "meaningful" = BH-significant AND |mean difference| >= this
  sink_mass: 0.02
  slot_mass: 0.02
  slot_logratio: 0.1
  prev_mass: 0.02
  entropy: 0.05

tracked_heads_csv: results/20260928-135243_exp1ext/tracked_heads.csv   # exp1ext's rule-selected heads + controls

replication:                    # the `none` rows should reproduce exp1's per-head mean sink_mass
  rare:   {run: results/20260927-235708_exp1, condition: A_rare}
  common: {run: results/20260928-004336_exp1, condition: C_common_clean}
  min_r: 0.99

stats:
  bootstrap_iters: 1000
  bootstrap_ci: 0.95
  bootstrap_seed: 0
  fdr_q: 0.05                   # BH over every (base, phrase, placement, contrast, head) test of one metric

validation:
  row_sum_atol: 1.0e-4
  determinism_n: 50
  cross_backend_atol: 1.0e-4

# Pre-registered checks, evaluated automatically against exp2/PREDICTIONS_testA.md (written before this test's run).
predictions_file: exp2/PREDICTIONS_testA.md
predictions:
  - {id: A1, kind: pooled_term_sign, term: VO, depth: late, sign: "+"}
  - {id: A2a, kind: pooled_term_sign, term: "VO−PV", depth: late, sign: "+"}
  - {id: A2b, kind: pooled_term_sign, term: "VO−PO", depth: late, sign: "+"}
  - {id: A3, kind: pooled_ratio_at_least, numerator: VO, denominator: nl, min_ratio: 0.5, depth: late}
  - {id: A4, kind: pooled_abs_less, term: triple, than: VO, depth: late}
  - {id: A5, kind: familiarity_rho_sign, label: VO, depth: late, sign: "-"}
  - id: A6a
    kind: controls
    min_mean: {L4H11: [prev_mass, 0.94], L5H1: [sink_mass, 0.90]}
    mode_label: {L0H1: Self}
  - id: A6b
    kind: few_meaningful
    contrast: placebo
    metric: sink_mass
    max_heads: {near: 1}

