# Experiment 2: does a short natural-language phrase written into random tokens change final-token attention,
# and is that change about the phrase being language, about its particular tokens, or about their surface form?
# The ONLY source of parameters for exp2. Positions are model-input indices (BOS at 0, random tokens at 1..32,
# final/query token at 32). Test C (adjective noun verb), 12 phrases, logit scale; see exp2/PREDICTIONS_testC.md.
model: gpt2-small
seq_len: 32                     # random tokens, excluding BOS
bos_token_id: 50256
query_position: -1              # final token; it is never overwritten, so it stays the base row's random token
diffuse_threshold: 0.2
batch_size: 250
seed: 0
device: cpu
dtype: float32

backends:
  transformer_lens: {model_name: gpt2-small}
  huggingface:      {model_name: gpt2, attn_implementation: eager}
primary_backend: transformer_lens

paths:
  sequences_dir: data/sequences/exp2
  results_dir: results

# Base rows: random ids, no repeats within a row, never containing any phrase id (a repeat would trigger
# duplicate-token / induction heads). Byte tokens (0-255) are left out entirely (exp1: they drive their own heads).
bases:
  rare:   [1000, 39999]         # exp1 condition A
  common: [256, 999]            # exp1 condition C
n_bases: 500                    # per base class; 12 phrases x 9 variants each

# Each phrase: ids are authoritative and written straight into the id array (text is only checked to tokenize to
# them). shuffled = first two swapped: same ids, last id kept in place (position 31 identical in nl and shuffled).
phrases:
  dogs: {text: " big dogs bark", ids: [1263, 6844, 21405], shuffled: [6844, 1263, 21405]}
  birds: {text: " small birds sing", ids: [1402, 10087, 1702], shuffled: [10087, 1402, 1702]}
  men: {text: " old men walk", ids: [1468, 1450, 2513], shuffled: [1450, 1468, 2513]}
  kids: {text: " young kids play", ids: [1862, 3988, 711], shuffled: [3988, 1862, 711]}
  water: {text: " hot water flows", ids: [3024, 1660, 15623], shuffled: [1660, 3024, 15623]}
  wind: {text: " cold wind blows", ids: [4692, 2344, 20385], shuffled: [2344, 4692, 20385]}
  stars: {text: " bright stars shine", ids: [6016, 5788, 18340], shuffled: [5788, 6016, 18340]}
  trees: {text: " tall trees grow", ids: [7331, 7150, 1663], shuffled: [7150, 7331, 1663]}
  cars: {text: " fast cars race", ids: [3049, 5006, 3234], shuffled: [5006, 3049, 3234]}
  bells: {text: " loud bells ring", ids: [7812, 30987, 5858], shuffled: [30987, 7812, 5858]}
  horses: {text: " wild horses run", ids: [4295, 14260, 1057], shuffled: [14260, 4295, 1057]}
  babies: {text: " tiny babies sleep", ids: [7009, 11903, 3993], shuffled: [11903, 7009, 3993]}

placements:
  near: [29, 30, 31]

# Each phrase token alone at each slot it occupies in nl or shuffled; the base row everywhere else.
custom_variants:
  "dogs:big@29": {phrase: dogs, placement: near, writes: [[29, 1263]]}
  "dogs:dogs@30": {phrase: dogs, placement: near, writes: [[30, 6844]]}
  "dogs:bark@31": {phrase: dogs, placement: near, writes: [[31, 21405]]}
  "dogs:dogs@29": {phrase: dogs, placement: near, writes: [[29, 6844]]}
  "dogs:big@30": {phrase: dogs, placement: near, writes: [[30, 1263]]}
