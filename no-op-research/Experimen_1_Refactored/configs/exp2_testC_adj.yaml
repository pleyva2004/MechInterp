  "birds:birds@30": {phrase: birds, placement: near, writes: [[30, 10087]]}
  "birds:sing@31": {phrase: birds, placement: near, writes: [[31, 1702]]}
  "birds:birds@29": {phrase: birds, placement: near, writes: [[29, 10087]]}
  "birds:small@30": {phrase: birds, placement: near, writes: [[30, 1402]]}
  "men:old@29": {phrase: men, placement: near, writes: [[29, 1468]]}
  "men:men@30": {phrase: men, placement: near, writes: [[30, 1450]]}
  "men:walk@31": {phrase: men, placement: near, writes: [[31, 2513]]}
  "men:men@29": {phrase: men, placement: near, writes: [[29, 1450]]}
