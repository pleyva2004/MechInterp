# Matched controls: per row, one random id per phrase token with the same values of these features and from the
# same id class as that token (exp1ext: leading space and byte-ness predicted per-token effects best).
match_features: [leading_space, is_alpha, is_capitalized]
token_classes:
  common: [256, 999]
  rare:   [1000, 39999]

# Paired contrasts, a - b per row. total = order + identity + form exactly (on means).
contrasts:
  total:    [nl, none]          # inserting the phrase at all
  order:    [nl, shuffled]      # word order / grammaticality, same tokens
  identity: [shuffled, matched] # these particular tokens vs same-form random tokens
  form:     [matched, none]     # same-form words vs the base class's random tokens
  placebo:  [matched, matched_b] # two exchangeable random draws: should show nothing (noise floor)

# interaction per row = (combo - none) - sum(part - none); 0 under exact additivity of the single-token effects
additivity:
  metrics: [sink_mass, sink_logit]   # sink_logit = log(p / (1 - p)): checks the bounded-scale objection
  combos:
    "dogs:nl":       {phrase: dogs, placement: near, variant: nl, parts: ["dogs:big@29", "dogs:dogs@30", "dogs:bark@31"]}
    "dogs:shuffled": {phrase: dogs, placement: near, variant: shuffled, parts: ["dogs:dogs@29", "dogs:big@30", "dogs:bark@31"]}
    "birds:nl":       {phrase: birds, placement: near, variant: nl, parts: ["birds:small@29", "birds:birds@30", "birds:sing@31"]}
    "birds:shuffled": {phrase: birds, placement: near, variant: shuffled, parts: ["birds:birds@29", "birds:small@30", "birds:sing@31"]}
    "men:nl":       {phrase: men, placement: near, variant: nl, parts: ["men:old@29", "men:men@30", "men:walk@31"]}
    "men:shuffled": {phrase: men, placement: near, variant: shuffled, parts: ["men:men@29", "men:old@30", "men:walk@31"]}
    "kids:nl":       {phrase: kids, placement: near, variant: nl, parts: ["kids:young@29", "kids:kids@30", "kids:play@31"]}
    "kids:shuffled": {phrase: kids, placement: near, variant: shuffled, parts: ["kids:kids@29", "kids:young@30", "kids:play@31"]}
    "water:nl":       {phrase: water, placement: near, variant: nl, parts: ["water:hot@29", "water:water@30", "water:flows@31"]}
    "water:shuffled": {phrase: water, placement: near, variant: shuffled, parts: ["water:water@29", "water:hot@30", "water:flows@31"]}
    "wind:nl":       {phrase: wind, placement: near, variant: nl, parts: ["wind:cold@29", "wind:wind@30", "wind:blows@31"]}
    "wind:shuffled": {phrase: wind, placement: near, variant: shuffled, parts: ["wind:wind@29", "wind:cold@30", "wind:blows@31"]}
    "stars:nl":       {phrase: stars, placement: near, variant: nl, parts: ["stars:bright@29", "stars:stars@30", "stars:shine@31"]}
    "stars:shuffled": {phrase: stars, placement: near, variant: shuffled, parts: ["stars:stars@29", "stars:bright@30", "stars:shine@31"]}
    "trees:nl":       {phrase: trees, placement: near, variant: nl, parts: ["trees:tall@29", "trees:trees@30", "trees:grow@31"]}
    "trees:shuffled": {phrase: trees, placement: near, variant: shuffled, parts: ["trees:trees@29", "trees:tall@30", "trees:grow@31"]}
    "cars:nl":       {phrase: cars, placement: near, variant: nl, parts: ["cars:fast@29", "cars:cars@30", "cars:race@31"]}
    "cars:shuffled": {phrase: cars, placement: near, variant: shuffled, parts: ["cars:cars@29", "cars:fast@30", "cars:race@31"]}
    "bells:nl":       {phrase: bells, placement: near, variant: nl, parts: ["bells:loud@29", "bells:bells@30", "bells:ring@31"]}
    "bells:shuffled": {phrase: bells, placement: near, variant: shuffled, parts: ["bells:bells@29", "bells:loud@30", "bells:ring@31"]}
    "horses:nl":       {phrase: horses, placement: near, variant: nl, parts: ["horses:wild@29", "horses:horses@30", "horses:run@31"]}
    "horses:shuffled": {phrase: horses, placement: near, variant: shuffled, parts: ["horses:horses@29", "horses:wild@30", "horses:run@31"]}
    "babies:nl":       {phrase: babies, placement: near, variant: nl, parts: ["babies:tiny@29", "babies:babies@30", "babies:sleep@31"]}
    "babies:shuffled": {phrase: babies, placement: near, variant: shuffled, parts: ["babies:babies@29", "babies:tiny@30", "babies:sleep@31"]}
  differences: [[nl, shuffled]]
depth_groups:
  early: [0, 1, 2, 3, 4, 5]
  late:  [6, 7, 8, 9, 10, 11]

# The model's own -log p(token | everything before it), TL only, summed over the slot positions; regressed against
# the additivity metric within each row across every variant. query_position_nll is recorded but not used in checks.
surprisal:
  slot_positions: [29, 30, 31]
  batch_size: 50                # full-vocabulary logits are built only at these positions

# slot_mass = attention on the slot positions; slot_logratio = log(slot_mass / sink_mass), which cancels the
# softmax normalizer (so it is not moved just because some other key gained or lost weight).
metrics: [sink_mass, slot_mass, prev_mass, entropy]
slot_logratio_eps: 1.0e-12      # floor on both masses inside the log
sink_logit_eps: 1.0e-6          # clip sink_mass to [eps, 1 - eps] before the logit
min_effect:                     # "meaningful" = BH-significant AND |mean difference| >= this
  sink_mass: 0.02
  slot_mass: 0.02
  slot_logratio: 0.1
  prev_mass: 0.02
  entropy: 0.05

tracked_heads_csv: results/20260928-135243_exp1ext/tracked_heads.csv   # exp1ext's rule-selected heads + controls

replication:                    # the `none` rows should reproduce exp1's per-head mean sink_mass
  rare:   {run: results/20260927-235708_exp1, condition: A_rare}
  common: {run: results/20260928-004336_exp1, condition: C_common_clean}
  min_r: 0.99

stats:
  bootstrap_iters: 1000
  bootstrap_ci: 0.95
  bootstrap_seed: 0
  fdr_q: 0.05                   # BH over every (base, phrase, placement, contrast, head) test of one metric

validation:
  row_sum_atol: 1.0e-4
  determinism_n: 50
  cross_backend_atol: 1.0e-4

# Pre-registered checks, evaluated automatically against exp2/PREDICTIONS_testC.md (written before any Test C data).
predictions_file: exp2/PREDICTIONS_testC.md
predictions:
  - {id: C1, kind: pooled_term_sign, term: nl, depth: late, sign: "+"}
  - {id: C2, kind: pooled_term_sign, term: "nl−shuffled", depth: late, sign: "+"}
  - {id: C3, kind: phrase_count, term: "nl−shuffled", depth: late, sign: "+", min_count: 8}
  - {id: C4, kind: pooled_term_sign, metric: sink_logit, term: "nl−shuffled", depth: late, sign: "+"}
  - id: C5a
    kind: controls
    min_mean: {L4H11: [prev_mass, 0.94], L5H1: [sink_mass, 0.90]}
    mode_label: {L0H1: Self}
  - id: C5b
    kind: few_meaningful
    contrast: placebo
    metric: sink_mass
    max_heads: {near: 1}

figures:
  tokenizer: gpt2               # decoding ids for features and display only, never to build model input
  per_phrase: [dogs]           # per-phrase heatmaps / forests / tables only for these; the rest are pooled
