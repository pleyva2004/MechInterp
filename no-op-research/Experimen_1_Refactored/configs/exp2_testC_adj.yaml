  "cars:fast@30": {phrase: cars, placement: near, writes: [[30, 3049]]}
  "bells:loud@29": {phrase: bells, placement: near, writes: [[29, 7812]]}
  "bells:bells@30": {phrase: bells, placement: near, writes: [[30, 30987]]}
  "bells:ring@31": {phrase: bells, placement: near, writes: [[31, 5858]]}
  "bells:bells@29": {phrase: bells, placement: near, writes: [[29, 30987]]}
  "bells:loud@30": {phrase: bells, placement: near, writes: [[30, 7812]]}
