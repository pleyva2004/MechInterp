  "kids:play@31": {phrase: kids, placement: near, writes: [[31, 711]]}
  "kids:kids@29": {phrase: kids, placement: near, writes: [[29, 3988]]}
  "kids:young@30": {phrase: kids, placement: near, writes: [[30, 1862]]}
  "water:hot@29": {phrase: water, placement: near, writes: [[29, 3024]]}
  "water:water@30": {phrase: water, placement: near, writes: [[30, 1660]]}
  "water:flows@31": {phrase: water, placement: near, writes: [[31, 15623]]}
  "water:water@29": {phrase: water, placement: near, writes: [[29, 1660]]}
  "water:hot@30": {phrase: water, placement: near, writes: [[30, 3024]]}
  "wind:cold@29": {phrase: wind, placement: near, writes: [[29, 4692]]}
